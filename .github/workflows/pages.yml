name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # Pages yuzeyi de canli bir kopya; bilinen bir SEO regresyonu ile
  # yayinlanmamasi icin build bu ise bagli.
  seo-tests:
    name: Teknik SEO regresyon testleri
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run SEO tests
        run: python -m unittest tests.test_seo_routing tests.test_seo_smoke

  build:
    needs: seo-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        run: |
          mkdir -p site
          cp *.html robots.txt sitemap.xml site/
          cp -R assets blog hizmetler seo reklam yazilim sektorler site/
          if [ -f CNAME ]; then cp CNAME site/CNAME; fi
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
